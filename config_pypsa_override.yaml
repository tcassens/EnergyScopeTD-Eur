# Override configuration for running PyPSA-Eur from the EnergyScope workflow.
# Adjust run metadata, scenario settings, country selection, snapshot window and
# atlite cutout definitions here to match the converted dataset you want to
# produce. These values complement the defaults in `config/config.default.yaml`.
run:
  name: "Europe_2015_39_2050" # change to run name in the format "Europe_<year>_<num_nodes>_<planning_horizon>"
  disable_progressbar: true
  shared_resources:
    policy: false
  shared_cutouts: true

scenario:
  clusters:
  - 39
  opts:
  - ''
  sector_opts:
  - T-H-B-I-A
  planning_horizons:
  - 2050 # change to planning horizon

countries:
- AL
- AT
- BA
- BE
- BG
- CH
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GB
- GR
- HR
- HU
- IE
- IT
- LT
- LU
- LV
- ME
- MK
- NL
- 'NO'
- PL
- PT
- RO
- RS
- SE
- SI
- SK
- XK

snapshots: # change to year
  start: "2015-01-01"
  end: "2016-01-01"
  inclusive: 'left'

atlite:
  default_cutout: "europe-2015-era5" # change to cutout name
  nprocesses: 16
  show_progress: false
  plot_availability_matrix: false
  cutouts:
    "europe-2015-era5": # change to cutout name
      module: era5
      x:
      - -12.0
      - 42.0
      'y':
      - 33.0
      - 72.0
      dx: 0.3
      dy: 0.3
      time:
      - '2015' #change to year
      - '2015' #change to year
      chunks:
        time: 500
      prepare_kwargs:
        features:
        - temperature
        - height
        - runoff
        monthly_requests: true
        tmpdir: ./cutouts_tmp/
